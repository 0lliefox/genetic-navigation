<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Always present, not just when a mobile user agent is detected, so the
         canvas fills the viewport on any narrow screen. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #1a1a1a; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #d8d8d8; background: #1a1a1a;
      }
      #bar { width: min(260px, 60vw); height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
      #bar > div { height: 100%; width: 0; background: #d8d8d8; transition: width .15s ease-out; }
      #error { display: none; max-width: 80vw; text-align: center; color: #ff8a80; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading">
      <div>Loading</div>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="error"></div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var barFill = document.querySelector("#bar-fill");
      var errorBox = document.querySelector("#error");

      // Rendering at the full device pixel ratio is the single most expensive
      // thing this page can do. A phone at ratio 3 renders nine times the pixels
      // of ratio 1 for no visible benefit at this art style, so cap it. Desktop
      // keeps a bit of sharpness, small screens get none of the cost.
      var isSmallScreen = Math.min(screen.width, screen.height) < 768
        || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var pixelRatio = isSmallScreen ? 1 : Math.min(window.devicePixelRatio || 1, 2);

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: pixelRatio,
      }, function (progress) {
        barFill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.style.display = "none";
      }).catch(function (message) {
        errorBox.style.display = "block";
        errorBox.textContent = message;
      });
    </script>
  </body>
</html>
